name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing Actions secret: HF_TOKEN"
            exit 1
          fi
          if [[ ! "$HF_SPACE" =~ ^[^/]+/[^/]+$ ]]; then
            echo "Set the Actions variable HF_SPACE to owner/space-name"
            exit 1
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
